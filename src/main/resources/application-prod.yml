# 운영 프로파일. DB 는 AWS RDS(MySQL 8). 비밀값은 컨테이너 환경변수로 주입한다.
#   DB_HOST / DB_PORT / DB_NAME / DB_USERNAME / DB_PASSWORD / JWT_SECRET
#   JWT_SECRET 은 Base64 여야 한다 (JjwtProvider 가 BASE64 디코딩 후 HMAC 키로 쓴다).
#
# ⚠️ ddl-auto: create — 기동할 때마다 테이블을 DROP 후 재생성한다.
#    배포·재기동마다 RDS 데이터가 초기화되고 시드가 다시 깔린다.
#    보존이 필요하면 SPRING_JPA_HIBERNATE_DDLAUTO=none 환경변수로 끈다.
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}?characterEncoding=UTF-8&connectionTimeZone=Asia/Seoul&forceConnectionTimeZoneToSession=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: create
    open-in-view: true

jwt:
  secret: ${JWT_SECRET}
  access-token-expire-seconds: 600
  refresh-token-expire-seconds: 1209600