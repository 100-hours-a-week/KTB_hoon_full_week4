name: CD

# CI(위 ci.yml) 가 main 에서 성공적으로 끝났을 때만 실행 → 테스트 깨진 코드는 배포되지 않음
on:
  workflow_run:
    workflows: [ "CI" ]
    types: [ completed ]
    branches: [ "main" ]

concurrency:
  group: cd-main
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # EC2 상의 docker-compose.yml / nginx.conf 가 있는 배포 디렉터리
  APP_DIR: app

jobs:
  deploy:
    # CI 성공 이벤트일 때만
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout (CI 가 통과한 커밋)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # ghcr.io/<owner>/<repo> 를 소문자로 (GHCR 이미지명은 소문자만 허용)
      - name: Compute image name
        id: img
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:latest
            ${{ steps.img.outputs.name }}:${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 기존 nginx+frontend+backend compose 구조 유지. backend 서비스만 새 이미지로 교체.
      - name: Deploy over SSH (compose)
        uses: appleboy/ssh-action@v1
        env:
          TAG: ${{ github.event.workflow_run.head_sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_DIR: ${{ env.APP_DIR }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: TAG,GHCR_USER,GHCR_TOKEN,APP_DIR
          script: |
            set -e
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            cd "$HOME/$APP_DIR"
            # compose 의 backend.image 태그(${BACKEND_TAG:-latest})를 이번 커밋 SHA 로 고정 → 불변 배포
            export BACKEND_TAG="$TAG"
            docker compose pull backend
            docker compose up -d backend
            # SHA 태그 이미지가 배포마다 쌓여 디스크를 채우므로(-f 는 태그 없는 것만 지움)
            # 미사용 + 7일 지난 이미지까지 정리한다. 최근 롤백 후보는 남는다.
            docker image prune -af --filter "until=168h"
