name: CI

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 포맷 위반이면 여기서 먼저 실패 → 원인이 명확 (build 안에도 포함되지만 명시)
      - name: Spotless check
        run: ./gradlew spotlessCheck

      # 컴파일 + 전체 테스트
      - name: Build with Gradle
        run: ./gradlew build
