# EC2 ~/app/docker-compose.yml (참고본)
# 이전 구조 그대로 nginx(리버스 프록시) + frontend + backend.
# 백엔드 이미지만 Docker Hub → GHCR 로 변경됨.
#
# CD 는 배포 시 BACKEND_TAG=<커밋 SHA> 를 export 한 뒤 `docker compose up -d backend` 하므로
# 매 배포가 특정 커밋 이미지로 고정된다. (수동 실행/재부팅 시엔 :latest 로 폴백)
services:
  backend:
    image: ghcr.io/100-hours-a-week/ktb_hoon_full_week4:${BACKEND_TAG:-latest}
    container_name: backend
    restart: unless-stopped
    expose:
      - "8080"

  frontend:
    image: lee26/fullstack-frontend:latest
    container_name: frontend
    restart: unless-stopped
    expose:
      - "80"

  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
