# EC2 ~/app/nginx.conf 의 사본 — 외부 리버스 프록시
# /api/* → backend:8080, 그 외 → frontend:80
#
# ⚠️ 이 파일은 배포되지 않는다. nginx 컨테이너가 마운트하는 ./nginx.conf 는
#    EC2 ~/app/ 기준 경로이며 이 레포 파일과 무관하다. 변경 시 EC2 에 수동 반영할 것.
#
# location /api/ 는 백엔드 컨트롤러의 @RequestMapping("/api/v1...") 과 짝을 이룬다.
# proxy_pass 에 경로가 없으므로 요청 경로가 그대로 전달된다. API prefix 를 바꾸면 여기도 같이 바꿀 것.
server {
    listen 80;
    server_name _;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
